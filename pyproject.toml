[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grashof-workspace"
version = "0.3.0"
description = "Analytical planar 3R and synthetic 6R spherical Grashof workspace research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.25",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
grashof-workspace = "grashof_workspace.cli:main"
sixr-grashof = "sixr_grashof.cli:main"
grashof-visual-probe = "grashof_workspace.visual_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grashof_workspace = ["dashboard_assets/*"]
sixr_grashof = ["data/*.json", "dashboard_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not stress'"
markers = [
  "stress: larger randomized property suite (not required on every commit)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["grashof_workspace", "sixr_grashof"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "scipy.*", "scipy.*.*"]
ignore_missing_imports = true
