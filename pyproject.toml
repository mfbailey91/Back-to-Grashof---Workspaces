[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grashof-workspace"
version = "0.2.0"
description = "Analytical planar 3R workspace characterization using an equivalent four-bar mechanism"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
grashof-workspace = "grashof_workspace.cli:main"
grashof-spatial4bar-explorer = "grashof_workspace.spatial4bar_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not stress'"
markers = [
  "stress: larger randomized property suite (not required on every commit)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["grashof_workspace"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
