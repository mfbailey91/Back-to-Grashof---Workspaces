# Residual thresholds for spherical / axis geometry reduction
# Never bury these in code — import via sixr_grashof.reductions.residuals

rho_exact: 1.0e-9
rho_invalid: 0.05
boundary_T_abs: 1.0e-12
angular_parallel_tol_rad: 1.0e-12
line_intersect_tol: 1.0e-12

nominal:
  L2: 1.0
  L3: 0.8
  Lt: 0.25

epsilon_w_sweep: [0.0, 0.025, 0.05, 0.10, 0.20]
epsilon_s_sweep: [0.0, 0.025, 0.05, 0.10, 0.20]
