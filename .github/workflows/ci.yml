name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --config-settings editable_mode=strict
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Markdown links
        run: python scripts/check_markdown_links.py
      - name: Tests
        run: pytest
      - name: Decomposition ladder artifact smoke
        env:
          MPLBACKEND: Agg
        run: |
          python -m grashof_workspace.decomposition_ladder.cli \
            --outdir outputs/decomposition_ladder \
            --no-animation
      - name: V05 audit artifact smoke
        env:
          MPLBACKEND: Agg
        run: |
          python -m grashof_workspace.spatial_experiments.v05b --outdir outputs/v05b --n-steps 8 --step-size 0.03
          python -m grashof_workspace.spatial_experiments.v05c --outdir outputs/v05c --n-steps 8 --step-size 0.03
          python -m grashof_workspace.spatial_experiments.v05d --outdir outputs/v05d
          python -m grashof_workspace.spatial_experiments.v05e --outdir outputs/v05e --n-fiber-steps 8 --fiber-step-size 0.03
      - name: R3A P1/P3 ci smoke
        env:
          MPLBACKEND: Agg
        run: |
          python -m grashof_workspace.spatial_experiments.l5_reconstruction.cli \
            --config configs/l5_positive_control_v1.json \
            --outdir outputs/r3a_hardening_smoke \
            --stage all --mode ci \
            --probe P1_DEEP_COMPLETE --probe P3_INNER_INCOMPLETE
          python scripts/package_r3a_campaign.py \
            --raw-root outputs/r3a_hardening_smoke \
            --results-root outputs/r3a_hardening_compact \
            --bundle-dir outputs/r3a_campaign_bundles
      - name: Atlas generation
        run: grashof-workspace --atlas --output-dir outputs/atlas
      - name: Upload diagnostic artifacts
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-diagnostics
          path: outputs/
