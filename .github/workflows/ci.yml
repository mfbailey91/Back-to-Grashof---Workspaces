name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --config-settings editable_mode=strict
      - name: Tests
        run: pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Atlas generation
        run: grashof-workspace --atlas --output-dir outputs/atlas
      - name: Upload atlas artifacts
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-outputs
          path: outputs/atlas
